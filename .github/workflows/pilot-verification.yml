name: GPS pilot verification

on:
  push:
    branches: ['work/gps-communication-pilot-20261008']
  pull_request:
    paths: ['app/**', 'routes/**', 'database/**', 'resources/**', 'apps/extension/**', 'tests/**', 'docs/**', '.github/workflows/pilot-verification.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      BROADCAST_CONNECTION: 'null'
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress >/tmp/composer-install.log 2>&1 && npm ci --no-audit --no-fund >/tmp/npm-install.log 2>&1
      - name: Collect verification results
        run: |
          mkdir -p /tmp/pilot-evidence
          python3 - <<'PY'
          import json, pathlib, subprocess
          out=pathlib.Path('/tmp/pilot-evidence')
          checks={
            'backend':'php artisan test',
            'php-static':'composer types:check',
            'frontend-types':'php artisan wayfinder:generate --with-form && npm run types:check',
            'build':'npm run build',
            'lint-format':'npm run check',
            'docs':'node --test scripts/check-docs.test.mjs && node scripts/check-docs.mjs',
            'whitespace':'git diff --check',
          }
          results={}
          for name,command in checks.items():
            with (out/(name+'.log')).open('w') as log:
              result=subprocess.run(command,shell=True,stdout=log,stderr=subprocess.STDOUT)
            results[name]={'command':command,'exit_code':result.returncode}
            print(name+': '+str(result.returncode),flush=True)
          (out/'results.json').write_text(json.dumps(results,indent=2))
          (out/'revision.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD']).decode())
          # Tracked source only: no .env, credentials, dependencies, runtime or customer data.
          subprocess.run(['git','archive','--format=tar.gz','-o',str(out/'tracked-source.tar.gz'),'HEAD'],check=True)
          raise SystemExit(1 if any(v['exit_code'] for v in results.values()) else 0)
          PY
      - name: Upload review evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pilot-verification-evidence
          path: /tmp/pilot-evidence/
          retention-days: 3
          if-no-files-found: error
