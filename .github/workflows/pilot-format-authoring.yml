name: Temporary pilot formatting

on:
  push:
    branches: ['work/gps-communication-pilot-20261008']

permissions:
  contents: read

jobs:
  format-owned-files:
    if: github.repository == 'BradenBoggs/PageRelay' && github.ref == 'refs/heads/work/gps-communication-pilot-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      APP_ENV: testing
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      CACHE_STORE: array
      SESSION_DRIVER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: composer install --no-interaction --prefer-dist && npm ci
      - name: Format only files authored by this pilot
        run: |
          git diff --name-only --diff-filter=AM 89c27d8e01393c7f85268fbcf8fd43bab0526749 HEAD > /tmp/pilot-owned
          mapfile -t php_files < <(grep -E '\.php$' /tmp/pilot-owned || true)
          mapfile -t other_files < <(grep -E '\.(tsx?|css|mjs|json|md|ya?ml)$' /tmp/pilot-owned | grep -v '^.github/' || true)
          if ((${#php_files[@]})); then vendor/bin/pint "${php_files[@]}"; fi
          if ((${#other_files[@]})); then node_modules/.bin/vp fmt "${other_files[@]}"; fi
          git diff --check
          while IFS= read -r path; do grep -Fxq "$path" /tmp/pilot-owned || { echo "Formatter touched an unrelated file: $path"; exit 1; }; done < <(git diff --name-only)
      - name: Commit formatting only if this exact branch still points to this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,subprocess,urllib.request
          repo='BradenBoggs/PageRelay'
          branch='work/gps-communication-pilot-20261008'
          sha=os.environ['GITHUB_SHA']
          def api(path, data=None, method=None):
              body=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path, data=body, method=method or ('GET' if data is None else 'POST'), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req) as result: return json.load(result)
          changed=subprocess.check_output(['git','diff','--name-only','-z']).decode().strip('\0').split('\0')
          if changed==['']: print('Already formatted'); raise SystemExit(0)
          allowed=set(open('/tmp/pilot-owned').read().splitlines())
          if any(p not in allowed or p.startswith('.github/') for p in changed): raise SystemExit('Unexpected formatting target')
          head=api('git/ref/heads/'+branch)['object']['sha']
          if head!=sha: raise SystemExit('Branch advanced; refusing to overwrite it')
          tree=[]
          for path in changed:
              with open(path,'rb') as f: content=base64.b64encode(f.read()).decode()
              blob=api('git/blobs',{'content':content,'encoding':'base64'})['sha']
              tree.append({'path':path,'mode':'100644','type':'blob','sha':blob})
          parent=api('git/commits/'+sha)
          tree_sha=api('git/trees',{'base_tree':parent['tree']['sha'],'tree':tree})['sha']
          commit=api('git/commits',{'message':'style: format pilot-owned files with locked tooling','tree':tree_sha,'parents':[sha]})['sha']
          api('git/refs/heads/'+branch,{'sha':commit,'force':False},'PATCH')
          print('Formatting commit: '+commit)
          PY
