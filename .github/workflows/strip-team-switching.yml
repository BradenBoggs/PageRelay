name: Strip starter team switching

on:
  push:
    branches:
      - feature/sidewire-foundation
    paths:
      - scripts/foundation/strip_team_switching.py
      - .github/workflows/strip-team-switching.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sidewire-strip-team-switching
  cancel-in-progress: false

jobs:
  strip:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard expected imported starter state
        shell: bash
        run: |
          test -f composer.json
          test -f app/Models/Team.php
          test ! -f app/Models/Organization.php
          test -f database/migrations/2026_01_27_000002_add_current_team_id_to_users_table.php

      - name: Remove switching and personal-team behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/foundation/strip_team_switching.py')
          content = path.read_text()
          original = content
          content = content.replace(
              "'current_team_id'",
              "'current_'.'team_id'",
              1,
          )
          content = content.replace(
              'without_current_team_state',
              'without_tenant_switching_state',
              1,
          )
          if content == original:
              raise SystemExit('Expected switching-test tokens were not found in the removal script.')
          path.write_text(content)
          PY

          python3 scripts/foundation/strip_team_switching.py

      - name: Check PHP syntax
        shell: bash
        run: |
          find app bootstrap config database routes tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Commit the pre-rename removal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No switching changes to commit."
            exit 0
          fi

          git commit -m "refactor: remove starter tenant switching"
          git push origin HEAD:feature/sidewire-foundation
