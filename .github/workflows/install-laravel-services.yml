name: Install Laravel service foundation

on:
  push:
    branches:
      - feature/sidewire-foundation
    paths:
      - .github/workflows/install-laravel-services.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sidewire-install-laravel-services
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard against reinstalling the service foundation
        id: guard
        shell: bash
        run: |
          if grep -q 'laravel/cashier' composer.json; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Laravel service packages are already present.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP
        if: steps.guard.outputs.skip == 'false'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, intl
          coverage: none

      - name: Set up Node
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install current locked dependencies
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Install maintained Laravel services
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          composer require \
            laravel/cashier \
            laravel/sanctum \
            laravel/reverb \
            laravel/horizon \
            'filament/filament:^5.0' \
            --with-all-dependencies \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Install package-owned application files
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --ansi

          php artisan install:api --no-interaction
          php artisan reverb:install --no-interaction
          php artisan horizon:install
          php artisan filament:install --panels --no-interaction
          php artisan vendor:publish --tag=cashier-migrations --force --no-interaction

      - name: Verify generated package entry points
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          grep -q 'laravel/cashier' composer.json
          grep -q 'laravel/sanctum' composer.json
          grep -q 'laravel/reverb' composer.json
          grep -q 'laravel/horizon' composer.json
          grep -q 'filament/filament' composer.json
          test -f config/sanctum.php
          test -f config/reverb.php
          test -f config/horizon.php
          test -f routes/api.php
          test -f routes/channels.php
          test -f app/Providers/Filament/AdminPanelProvider.php

      - name: Commit installed package foundation
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all

          if git diff --cached --quiet; then
            echo 'No package installation changes to commit.'
            exit 0
          fi

          git commit -m 'build: install Laravel service foundation'
          git push origin HEAD:feature/sidewire-foundation
