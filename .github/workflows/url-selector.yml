name: URL selector verification
on:
  push:
    branches: [work/url-match-selector-20260926]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Package tracked source for isolated review
        run: git archive --format=zip HEAD -o /tmp/sidewire-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sidewire-source
          path: /tmp/sidewire-source.zip
          retention-days: 1
