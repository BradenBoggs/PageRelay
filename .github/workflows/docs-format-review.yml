name: Temporary documentation formatting review

on:
  push:
    branches: [docs/slack-feature-review-20260927]
    paths: [.github/workflows/docs-format-review.yml]

permissions:
  contents: read

jobs:
  format:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Format only the seven reported documentation files
        run: |
          files=(AGENTS.md docs/INDEX.md docs/QUALITY.md docs/features/README.md docs/plans/README.md scripts/check-docs.mjs scripts/check-docs.test.mjs)
          ./node_modules/.bin/vp fmt --write "${files[@]}"
          node --test scripts/check-docs.test.mjs
          node scripts/check-docs.mjs
          git diff --check
          mkdir -p /tmp/sidewire-doc-format
          tar -czf /tmp/sidewire-doc-format/formatted-docs.tar.gz "${files[@]}"
          git diff -- "${files[@]}" > /tmp/sidewire-doc-format/format.patch
          echo 'FORMAT_PATCH_START'
          cat /tmp/sidewire-doc-format/format.patch
          echo 'FORMAT_PATCH_END'
      - uses: actions/upload-artifact@v4
        with:
          name: sidewire-doc-format
          path: /tmp/sidewire-doc-format/
          retention-days: 1
