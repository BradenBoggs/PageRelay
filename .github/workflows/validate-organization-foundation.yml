name: Validate Organization foundation

on:
  push:
    branches:
      - feature/sidewire-foundation
    paths:
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - resources/**
      - routes/**
      - tests/**
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
      - phpstan.neon
      - vite.config.ts
      - tsconfig.json
      - .github/workflows/validate-organization-foundation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sidewire-validate-organization-foundation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: true
      SIDEWIRE_FOUNDATION_CHECKPOINT: workspaces-and-teams

    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve locked dependencies
        shell: bash
        run: |
          composer update --no-interaction --prefer-dist --no-progress
          npm install --no-audit --no-fund

      - name: Prepare the application
        shell: bash
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --ansi
          php artisan migrate:fresh --seed --no-interaction --ansi
          php artisan route:list --except-vendor --ansi

      - name: Build and type-check the React application
        shell: bash
        run: |
          npm run build
          npm run types:check

      - name: Run backend tests and PHP static analysis
        shell: bash
        run: |
          php artisan test --colors=always
          composer types:check

      - name: Apply and verify repository formatting
        shell: bash
        run: |
          composer lint
          npm run check:fix
          composer lint:check
          npm run check

      - name: Commit validated lockfiles and formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo 'The validated foundation is already clean.'
            exit 0
          fi

          git commit -m 'build: lock and format validated foundation'
          git push origin HEAD:feature/sidewire-foundation
